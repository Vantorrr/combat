<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alfa CRM - Новый звонок</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        alfa: { red: '#EF3124', redHover: '#D92B1E', black: '#0B0B0B', darkGray: '#1A1A1A', cardBg: '#141414', textGray: '#999999', border: '#2A2A2A' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0B0B0B; color: white; }
        .glass-card { background: #141414; border: 1px solid #2A2A2A; border-radius: 16px; }
        .nav-blur { background: rgba(11, 11, 11, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid #2A2A2A; }
        .step-dot { transition: all 0.3s ease; }
        .step-dot.active { background: #EF3124; width: 24px; border-radius: 12px; }
        .step-dot.done { background: #22C55E; }
        .toast { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen pb-8">
    <!-- Navbar -->
    <nav class="nav-blur fixed top-0 w-full z-50">
        <div class="max-w-xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-16 items-center">
                <a href="/dashboard.html" class="flex items-center gap-2 text-alfa-textGray hover:text-white transition-colors">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    <span class="text-sm font-medium">Назад</span>
                </a>
                <span class="text-lg font-bold">Новый звонок</span>
                <div class="w-16"></div>
            </div>
        </div>
    </nav>

    <!-- Progress Steps -->
    <div class="max-w-xl mx-auto px-4 sm:px-6 pt-24 mb-8">
        <div class="flex items-center justify-center gap-2">
            <div class="step-dot active w-2 h-2 rounded-full bg-alfa-border" id="dot1"></div>
            <div class="step-dot w-2 h-2 rounded-full bg-alfa-border" id="dot2"></div>
            <div class="step-dot w-2 h-2 rounded-full bg-alfa-border" id="dot3"></div>
            <div class="step-dot w-2 h-2 rounded-full bg-alfa-border" id="dot4"></div>
        </div>
        <p class="text-center text-xs text-alfa-textGray mt-2" id="stepLabel">Шаг 1 из 4 — Поиск компании</p>
    </div>

    <main class="max-w-xl mx-auto px-4 sm:px-6">

        <!-- ===== STEP 1: INN ===== -->
        <div id="step1" class="fade-in">
            <div class="glass-card p-6">
                <h2 class="text-lg font-semibold mb-4">Введите ИНН компании</h2>
                <input type="text" id="innInput" maxlength="12" placeholder="10 или 12 цифр" autofocus
                    class="w-full bg-[#0B0B0B] border border-[#2A2A2A] rounded-xl p-4 text-white text-xl text-center tracking-[0.3em] font-mono focus:border-alfa-red focus:outline-none mb-5">
                <button onclick="lookupInn()" id="innBtn" class="w-full bg-alfa-red text-white font-semibold py-4 rounded-xl hover:bg-alfa-redHover transition-all shadow-lg shadow-red-900/20">
                    Найти компанию
                </button>
                <div id="innError" class="text-red-400 text-sm mt-3 hidden"></div>
            </div>
        </div>

        <!-- ===== STEP 2: CONFIRM COMPANY ===== -->
        <div id="step2" class="hidden fade-in">
            <div class="glass-card p-6 mb-4">
                <div class="flex items-start justify-between mb-4">
                    <div>
                        <p class="text-xs text-alfa-textGray uppercase tracking-wider mb-1">Компания</p>
                        <h2 class="text-lg font-bold text-white" id="companyName"></h2>
                    </div>
                    <span class="text-xs bg-green-500/10 text-green-400 px-2 py-1 rounded-lg border border-green-500/20" id="companyStatus"></span>
                </div>
                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div><p class="text-xs text-alfa-textGray">ИНН</p><p class="text-white font-mono" id="companyInn"></p></div>
                    <div><p class="text-xs text-alfa-textGray">ОКВЭД</p><p class="text-white" id="companyOkved"></p></div>
                    <div class="col-span-2"><p class="text-xs text-alfa-textGray">Адрес</p><p class="text-white text-xs" id="companyAddress"></p></div>
                    <div><p class="text-xs text-alfa-textGray">Руководитель</p><p class="text-white text-xs" id="companyDirector"></p></div>
                    <div><p class="text-xs text-alfa-textGray">Выручка</p><p class="text-white" id="companyRevenue"></p></div>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="confirmCompany()" class="flex-1 bg-alfa-red text-white font-semibold py-3.5 rounded-xl hover:bg-alfa-redHover transition-all shadow-lg shadow-red-900/20">
                    Подтвердить
                </button>
                <button onclick="goToStep(1)" class="px-5 py-3.5 border border-alfa-border rounded-xl text-alfa-textGray hover:text-white transition-colors">
                    Другой ИНН
                </button>
            </div>
        </div>

        <!-- ===== STEP 3: CONTACT INFO ===== -->
        <div id="step3" class="hidden fade-in">
            <div class="glass-card p-6">
                <h2 class="text-lg font-semibold mb-5">Контактная информация</h2>
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-alfa-textGray mb-2">ФИО контактного лица *</label>
                        <input type="text" id="contactName" required class="w-full bg-[#0B0B0B] border border-[#2A2A2A] rounded-xl p-3 text-white focus:border-alfa-red focus:outline-none" placeholder="Иванов Иван Иванович">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-alfa-textGray mb-2">Телефон *</label>
                        <input type="tel" id="contactPhone" required class="w-full bg-[#0B0B0B] border border-[#2A2A2A] rounded-xl p-3 text-white focus:border-alfa-red focus:outline-none" placeholder="+7 (___) ___-__-__">
                    </div>
                </div>
                <button onclick="goToStep(4)" class="w-full bg-alfa-red text-white font-semibold py-4 rounded-xl hover:bg-alfa-redHover transition-all shadow-lg shadow-red-900/20 mt-6">
                    Далее
                </button>
            </div>
        </div>

        <!-- ===== STEP 4: COMMENT & DATE ===== -->
        <div id="step4" class="hidden fade-in">
            <div class="glass-card p-6">
                <h2 class="text-lg font-semibold mb-5">Комментарий и дата</h2>
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-alfa-textGray mb-2">Комментарий к звонку *</label>
                        <textarea id="callComment" rows="3" required class="w-full bg-[#0B0B0B] border border-[#2A2A2A] rounded-xl p-3 text-white focus:border-alfa-red focus:outline-none placeholder-gray-600" placeholder="Что обсуждали, договоренности"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-alfa-textGray mb-2">Дата следующего звонка</label>
                        <input type="text" id="nextCallDate" placeholder="ДД.ММ.ГГ" class="w-full bg-[#0B0B0B] border border-[#2A2A2A] rounded-xl p-3 text-white focus:border-alfa-red focus:outline-none text-center tracking-widest">
                        <div class="flex gap-2 mt-3">
                            <button type="button" onclick="setNextDate(1)" class="px-3 py-1.5 bg-white/5 rounded-lg text-xs text-white hover:bg-white/10">Завтра</button>
                            <button type="button" onclick="setNextDate(2)" class="px-3 py-1.5 bg-white/5 rounded-lg text-xs text-white hover:bg-white/10">Послезавтра</button>
                            <button type="button" onclick="setNextDate(7)" class="px-3 py-1.5 bg-white/5 rounded-lg text-xs text-white hover:bg-white/10">Через неделю</button>
                        </div>
                    </div>
                </div>
                <button onclick="saveNewCall()" id="saveBtn" class="w-full bg-alfa-red text-white font-semibold py-4 rounded-xl hover:bg-alfa-redHover transition-all shadow-lg shadow-red-900/20 mt-6">
                    Сохранить звонок
                </button>
            </div>
        </div>

        <!-- ===== SUCCESS ===== -->
        <div id="stepSuccess" class="hidden fade-in text-center py-12">
            <div class="w-20 h-20 bg-green-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="check-circle" class="w-10 h-10 text-green-500"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">Звонок сохранен!</h2>
            <p class="text-alfa-textGray mb-8" id="successCompany"></p>
            <div class="flex gap-3 max-w-xs mx-auto">
                <a href="/dashboard.html" class="flex-1 bg-white text-black font-semibold py-3 rounded-xl text-center hover:bg-gray-200 transition-colors">К задачам</a>
                <button onclick="resetWizard()" class="flex-1 border border-alfa-border text-white font-medium py-3 rounded-xl hover:bg-white/5 transition-colors">Еще звонок</button>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-[70] space-y-2"></div>

    <script>
        lucide.createIcons();
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/';

        let companyData = null;
        let currentStep = 1;

        function showToast(msg, type = 'success') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-blue-600' };
            t.className = `toast ${colors[type]} text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium max-w-xs`;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        async function api(url, opts = {}) {
            const r = await fetch(url, { ...opts, headers: { 'Authorization': `Bearer ${token}`, ...(opts.headers || {}) } });
            if (r.status === 401) { localStorage.clear(); window.location.href = '/'; return null; }
            return r;
        }

        const stepLabels = {
            1: 'Шаг 1 из 4 — Поиск компании',
            2: 'Шаг 2 из 4 — Подтверждение',
            3: 'Шаг 3 из 4 — Контактная информация',
            4: 'Шаг 4 из 4 — Комментарий и дата'
        };

        function goToStep(n) {
            currentStep = n;
            for (let i = 1; i <= 4; i++) {
                const el = document.getElementById('step' + i);
                if (el) el.classList.add('hidden');
                const dot = document.getElementById('dot' + i);
                dot.classList.remove('active', 'done');
                if (i < n) dot.classList.add('done');
                if (i === n) dot.classList.add('active');
            }
            document.getElementById('stepSuccess').classList.add('hidden');
            const el = document.getElementById('step' + n);
            if (el) { el.classList.remove('hidden'); el.classList.add('fade-in'); }
            document.getElementById('stepLabel').textContent = stepLabels[n] || '';
        }

        // Step 1: INN Lookup
        async function lookupInn() {
            const inn = document.getElementById('innInput').value.trim();
            const errEl = document.getElementById('innError');
            errEl.classList.add('hidden');
            
            if (!inn || (inn.length !== 10 && inn.length !== 12) || !/^\d+$/.test(inn)) {
                errEl.textContent = 'ИНН должен содержать 10 или 12 цифр';
                errEl.classList.remove('hidden');
                return;
            }
            
            const btn = document.getElementById('innBtn');
            btn.disabled = true; btn.textContent = 'Поиск...';
            
            // Check for duplicate
            try {
                const vr = await api('/calls/validate_inn', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ inn })
                });
                const vd = await vr.json();
                if (vd.duplicate) {
                    errEl.textContent = `Компания "${vd.existing_company}" уже есть в базе. Используйте "Повторный звонок".`;
                    errEl.classList.remove('hidden');
                    btn.disabled = false; btn.textContent = 'Найти компанию';
                    return;
                }
            } catch (e) { /* continue */ }
            
            // Lookup
            try {
                const r = await api('/calls/lookup_inn', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ inn })
                });
                const data = await r.json();
                
                if (data.found && data.company) {
                    companyData = data.company;
                    document.getElementById('companyName').textContent = companyData.name;
                    document.getElementById('companyInn').textContent = inn;
                    document.getElementById('companyOkved').textContent = companyData.okved || '---';
                    document.getElementById('companyAddress').textContent = companyData.address || '---';
                    document.getElementById('companyDirector').textContent = companyData.director || '---';
                    document.getElementById('companyRevenue').textContent = companyData.revenue || '---';
                    document.getElementById('companyStatus').textContent = companyData.status || 'Найдена';
                    goToStep(2);
                } else {
                    companyData = { name: '', inn };
                    // Not found, let user enter manually
                    showToast('Компания не найдена в базе. Введите данные вручную.', 'info');
                    goToStep(3);
                }
            } catch (e) { showToast('Ошибка поиска', 'error'); }
            finally { btn.disabled = false; btn.textContent = 'Найти компанию'; }
        }

        // Step 2: Confirm
        function confirmCompany() { goToStep(3); }

        // Step 4: Date helper
        function setNextDate(days) {
            const d = new Date(); d.setDate(d.getDate() + days);
            document.getElementById('nextCallDate').value = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getFullYear()).slice(2)}`;
        }

        // Save
        async function saveNewCall() {
            const contact = document.getElementById('contactName').value.trim();
            const phone = document.getElementById('contactPhone').value.trim();
            const comment = document.getElementById('callComment').value.trim();
            const nextDate = document.getElementById('nextCallDate').value.trim();
            
            if (!contact || contact.length < 2) { showToast('Введите ФИО контакта', 'info'); return; }
            if (!phone) { showToast('Введите телефон', 'info'); return; }
            if (!comment) { showToast('Введите комментарий', 'info'); return; }
            
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.textContent = 'Сохранение...';
            
            const inn = document.getElementById('innInput').value.trim();
            
            try {
                const r = await api('/calls/new', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        inn,
                        company_name: companyData?.name || '',
                        contact_name: contact,
                        phone,
                        comment,
                        next_call_date: nextDate,
                        company_data: companyData
                    })
                });
                
                if (r && r.ok) {
                    document.getElementById('successCompany').textContent = (companyData?.name || 'ИНН ' + inn) + ' | ' + contact;
                    for (let i = 1; i <= 4; i++) document.getElementById('step' + i).classList.add('hidden');
                    document.getElementById('stepSuccess').classList.remove('hidden');
                    lucide.createIcons();
                } else {
                    const data = await r.json();
                    showToast(data.detail || 'Ошибка сохранения', 'error');
                }
            } catch (e) { showToast('Ошибка сети', 'error'); }
            finally { btn.disabled = false; btn.textContent = 'Сохранить звонок'; }
        }

        function resetWizard() {
            companyData = null;
            document.getElementById('innInput').value = '';
            document.getElementById('contactName').value = '';
            document.getElementById('contactPhone').value = '';
            document.getElementById('callComment').value = '';
            document.getElementById('nextCallDate').value = '';
            goToStep(1);
        }

        // Enter key in INN input
        document.getElementById('innInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') lookupInn();
        });
    </script>
</body>
</html>
