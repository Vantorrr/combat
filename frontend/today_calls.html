<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alfa CRM - Звонки на сегодня</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        alfa: { red: '#EF3124', redHover: '#D92B1E', black: '#0B0B0B', darkGray: '#1A1A1A', cardBg: '#141414', textGray: '#999999', border: '#2A2A2A' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0B0B0B; color: white; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0B0B0B; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .glass-card { background: #141414; border: 1px solid #2A2A2A; border-radius: 16px; }
        .nav-blur { background: rgba(11, 11, 11, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid #2A2A2A; }
        .bottom-nav { background: rgba(11, 11, 11, 0.92); backdrop-filter: blur(16px); border-top: 1px solid #2A2A2A; }
        .bottom-nav-btn.active { color: #EF3124; }
        .toast { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .fade-in { animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen pb-24 sm:pb-8">
    <!-- Navbar -->
    <nav class="nav-blur fixed top-0 w-full z-50">
        <div class="max-w-3xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 bg-alfa-red rounded-lg flex items-center justify-center text-white font-extrabold text-lg shadow-lg shadow-red-900/30">A</div>
                    <span class="text-lg font-bold tracking-tight">CRM</span>
                </div>
                <div class="flex items-center space-x-3">
                    <a href="/dashboard.html" class="text-sm text-alfa-textGray hover:text-white transition-colors flex items-center gap-1.5 px-3 py-1.5 rounded-lg hover:bg-white/5">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">К задачам</span>
                    </a>
                    <button onclick="logout()" class="p-2 text-alfa-textGray hover:text-white transition-colors rounded-lg hover:bg-white/5">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 pt-24">
        <div class="flex justify-between items-end mb-6">
            <div>
                <h1 class="text-2xl font-bold">Звонки на сегодня</h1>
                <p class="text-alfa-textGray text-sm mt-1" id="currentDate"></p>
            </div>
            <div class="flex gap-2">
                <button onclick="generateDailyPlan()" class="flex items-center gap-2 bg-alfa-red/10 text-alfa-red px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-alfa-red/20 transition-colors border border-alfa-red/20" id="aiPlanBtn">
                    <i data-lucide="sparkles" class="w-4 h-4"></i> AI-план
                </button>
                <button onclick="loadCalls()" class="p-2.5 bg-white/5 rounded-xl hover:bg-white/10 transition-colors">
                    <i data-lucide="refresh-cw" class="w-5 h-5 text-alfa-textGray"></i>
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div id="statsBar" class="glass-card p-4 mb-6 hidden">
            <div class="flex items-center justify-between">
                <span class="text-sm text-alfa-textGray">Всего звонков на сегодня:</span>
                <span class="text-lg font-bold text-white" id="callsCount">0</span>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center py-20">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-alfa-red mx-auto"></div>
            <p class="mt-4 text-alfa-textGray text-sm">Загружаем данные...</p>
        </div>

        <!-- Calls List -->
        <div id="callsContainer" class="space-y-3 hidden"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="calendar-check" class="h-10 w-10 text-green-500"></i>
            </div>
            <h2 class="text-xl font-bold text-white">Нет звонков на сегодня</h2>
            <p class="text-alfa-textGray mt-2">Все задачи на сегодня выполнены</p>
        </div>
    </main>

    <!-- AI Plan Modal -->
    <div id="aiPlanModal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeAiPlan()"></div>
        <div class="absolute bottom-0 sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 w-full sm:w-[520px] max-h-[80vh] bg-[#141414] sm:rounded-2xl rounded-t-2xl border-t sm:border border-[#2A2A2A] shadow-2xl overflow-hidden flex flex-col">
            <div class="p-6 pb-0 shrink-0">
                <div class="w-12 h-1 bg-white/10 rounded-full mx-auto mb-6 sm:hidden"></div>
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-5 h-5 text-alfa-red"></i> AI-план на сегодня
                    </h3>
                    <button onclick="closeAiPlan()" class="text-alfa-textGray hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
                </div>
            </div>
            <div class="px-6 pb-6 overflow-y-auto flex-1">
                <div id="aiPlanLoading" class="text-center py-8">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-alfa-red mx-auto"></div>
                    <p class="text-alfa-textGray text-xs mt-3">Генерирую план...</p>
                </div>
                <div id="aiPlanContent" class="text-sm text-gray-300 leading-relaxed whitespace-pre-wrap hidden"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation (Mobile) -->
    <div class="bottom-nav fixed bottom-0 w-full z-50 sm:hidden">
        <div class="grid grid-cols-5 gap-1 px-2 py-2">
            <a href="/dashboard.html" class="bottom-nav-btn text-alfa-textGray flex flex-col items-center py-1.5">
                <i data-lucide="list-checks" class="w-5 h-5"></i>
                <span class="text-[10px] mt-0.5 font-medium">Задачи</span>
            </a>
            <a href="/new_call.html" class="bottom-nav-btn text-alfa-textGray flex flex-col items-center py-1.5">
                <i data-lucide="phone-outgoing" class="w-5 h-5"></i>
                <span class="text-[10px] mt-0.5 font-medium">Новый</span>
            </a>
            <a href="/dashboard.html" class="bottom-nav-btn text-alfa-textGray flex flex-col items-center py-1.5">
                <i data-lucide="phone-forwarded" class="w-5 h-5"></i>
                <span class="text-[10px] mt-0.5 font-medium">Повторный</span>
            </a>
            <a href="/today_calls.html" class="bottom-nav-btn active flex flex-col items-center py-1.5">
                <i data-lucide="calendar" class="w-5 h-5"></i>
                <span class="text-[10px] mt-0.5 font-medium">Сегодня</span>
            </a>
            <button onclick="openMySheet()" class="bottom-nav-btn text-alfa-textGray flex flex-col items-center py-1.5">
                <i data-lucide="table" class="w-5 h-5"></i>
                <span class="text-[10px] mt-0.5 font-medium">Таблица</span>
            </button>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-20 sm:bottom-6 right-6 z-[70] space-y-2"></div>

    <script>
        lucide.createIcons();
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/';
        
        const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('ru-RU', opts);

        function showToast(msg, type = 'success') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-blue-600' };
            t.className = `toast ${colors[type]} text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium max-w-xs`;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        async function api(url, opts = {}) {
            const r = await fetch(url, { ...opts, headers: { 'Authorization': `Bearer ${token}`, ...(opts.headers || {}) } });
            if (r.status === 401) { localStorage.clear(); window.location.href = '/'; return null; }
            return r;
        }

        async function loadCalls() {
            const container = document.getElementById('callsContainer');
            const loader = document.getElementById('loading');
            container.classList.add('hidden');
            loader.classList.remove('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('statsBar').classList.add('hidden');

            try {
                const r = await api('/sheets/today_calls');
                if (!r) return;
                const calls = await r.json();
                renderCalls(calls);
            } catch (e) { console.error(e); }
            finally { loader.classList.add('hidden'); }
        }

        function renderCalls(calls) {
            const container = document.getElementById('callsContainer');
            container.innerHTML = '';
            
            if (!calls.length) {
                container.classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            document.getElementById('statsBar').classList.remove('hidden');
            document.getElementById('callsCount').textContent = calls.length;
            
            calls.forEach((call, idx) => {
                const div = document.createElement('div');
                div.className = 'glass-card p-4 fade-in';
                div.style.animationDelay = (idx * 40) + 'ms';
                div.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-xs text-alfa-textGray font-mono">${idx + 1}</span>
                                <h3 class="text-sm font-semibold text-white truncate">${call.company_name}</h3>
                            </div>
                            <p class="text-xs text-alfa-textGray font-mono mb-2">ИНН ${call.inn}</p>
                            <div class="flex flex-wrap gap-3 text-xs">
                                <span class="text-gray-400"><span class="text-alfa-textGray">Контакт:</span> ${call.contact_name || '---'}</span>
                                ${call.phone ? `<a href="tel:${call.phone}" class="text-blue-400 hover:underline">${call.phone}</a>` : ''}
                            </div>
                        </div>
                        <a href="tel:${call.phone}" class="shrink-0 ml-3 w-10 h-10 rounded-full bg-green-500/10 flex items-center justify-center text-green-400 hover:bg-green-500/20 transition-colors">
                            <i data-lucide="phone" class="w-4 h-4"></i>
                        </a>
                    </div>
                `;
                container.appendChild(div);
            });
            lucide.createIcons();
        }

        // AI Daily Plan
        async function generateDailyPlan() {
            document.getElementById('aiPlanModal').classList.remove('hidden');
            document.getElementById('aiPlanLoading').classList.remove('hidden');
            document.getElementById('aiPlanContent').classList.add('hidden');
            lucide.createIcons();
            
            const btn = document.getElementById('aiPlanBtn');
            btn.disabled = true;
            
            try {
                const r = await api('/ai/daily_plan', { method: 'POST' });
                if (!r) return;
                const data = await r.json();
                document.getElementById('aiPlanLoading').classList.add('hidden');
                document.getElementById('aiPlanContent').textContent = data.plan || 'Нет данных';
                document.getElementById('aiPlanContent').classList.remove('hidden');
            } catch (e) {
                document.getElementById('aiPlanLoading').classList.add('hidden');
                document.getElementById('aiPlanContent').textContent = 'Ошибка генерации плана';
                document.getElementById('aiPlanContent').classList.remove('hidden');
            }
            finally { btn.disabled = false; }
        }

        function closeAiPlan() { document.getElementById('aiPlanModal').classList.add('hidden'); }

        async function openMySheet() {
            try {
                const r = await api('/sheets/my');
                if (!r) return;
                const data = await r.json();
                window.open(data.url, '_blank');
            } catch (e) { showToast('Ошибка', 'error'); }
        }

        function logout() { localStorage.clear(); window.location.href = '/'; }

        loadCalls();
    </script>
</body>
</html>
