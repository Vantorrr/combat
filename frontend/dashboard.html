<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alfa CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        alfa: {
                            red: '#EF3124', redHover: '#D92B1E', redDark: '#8B1A12',
                            black: '#0B0B0B', darkGray: '#1A1A1A', cardBg: '#141414',
                            textGray: '#999999', border: '#2A2A2A', borderLight: '#333333'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0B0B0B; color: white; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0B0B0B; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .glass-card { background: #141414; border: 1px solid #2A2A2A; border-radius: 16px; }
        .nav-blur { background: rgba(11, 11, 11, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid #2A2A2A; }
        .bottom-nav { background: rgba(11, 11, 11, 0.92); backdrop-filter: blur(16px); border-top: 1px solid #2A2A2A; }
        .task-card { transition: transform 0.15s ease; }
        .task-card:active { transform: scale(0.98); }
        .toast { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .fade-in { animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .bottom-nav-btn.active { color: #EF3124; }
        .bottom-nav-btn { transition: color 0.2s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-24 sm:pb-8">
    <!-- Navbar -->
    <nav class="nav-blur fixed top-0 w-full z-50">
        <div class="max-w-3xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 bg-alfa-red rounded-lg flex items-center justify-center text-white font-extrabold text-lg shadow-lg shadow-red-900/30">A</div>
                    <span class="text-lg font-bold tracking-tight">CRM</span>
                </div>
                <div class="flex items-center space-x-3">
                    <div id="adminLinkContainer" class="hidden">
                        <a href="/admin.html" class="text-sm text-alfa-textGray hover:text-white transition-colors flex items-center gap-1.5 px-3 py-1.5 rounded-lg hover:bg-white/5">
                            <i data-lucide="shield" class="w-4 h-4"></i>
                            <span class="hidden sm:inline">Админка</span>
                        </a>
                    </div>
                    <div class="text-right hidden sm:block">
                        <p id="userName" class="text-sm font-medium text-white"></p>
                        <p class="text-xs text-alfa-textGray" id="userRoleLabel">Менеджер</p>
                    </div>
                    <button onclick="logout()" class="p-2 text-alfa-textGray hover:text-white transition-colors rounded-lg hover:bg-white/5">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 pt-24">
        <!-- Header -->
        <div class="flex justify-between items-end mb-6">
            <div>
                <h1 class="text-2xl font-bold" id="pageTitle">Задачи на сегодня</h1>
                <p class="text-alfa-textGray text-sm mt-1" id="currentDate"></p>
            </div>
            <button onclick="loadTasks()" class="p-2.5 bg-white/5 rounded-xl hover:bg-white/10 transition-colors">
                <i data-lucide="refresh-cw" class="w-5 h-5 text-alfa-textGray"></i>
            </button>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center py-20">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-alfa-red mx-auto"></div>
            <p class="mt-4 text-alfa-textGray text-sm">Загружаем данные...</p>
        </div>

        <!-- Tasks Container -->
        <div id="tasksContainer" class="space-y-4 hidden"></div>
        
        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="check" class="h-10 w-10 text-green-500"></i>
            </div>
            <h2 class="text-xl font-bold text-white">Все выполнено!</h2>
            <p class="text-alfa-textGray mt-2 max-w-xs mx-auto">На сегодня запланированных звонков больше нет.</p>
        </div>
    </main>

    <!-- Bottom Navigation (Mobile) -->
    <div class="bottom-nav fixed bottom-0 w-full z-50 sm:hidden safe-area-inset-bottom">
        <div class="grid grid-cols-5 gap-1 px-2 py-2">
            <a href="/dashboard.html" class="bottom-nav-btn active flex flex-col items-center py-1.5">
                <i data-lucide="list-checks" class="w-5 h-5"></i>
                <span class="text-[10px] mt-0.5 font-medium">Задачи</span>
            </a>
            <a href="/new_call.html" class="bottom-nav-btn text-alfa-textGray flex flex-col items-center py-1.5">
                <i data-lucide="phone-outgoing" class="w-5 h-5"></i>
                <span class="text-[10px] mt-0.5 font-medium">Новый</span>
            </a>
            <button onclick="openRepeatCallModal()" class="bottom-nav-btn text-alfa-textGray flex flex-col items-center py-1.5">
                <i data-lucide="phone-forwarded" class="w-5 h-5"></i>
                <span class="text-[10px] mt-0.5 font-medium">Повторный</span>
            </button>
            <a href="/today_calls.html" class="bottom-nav-btn text-alfa-textGray flex flex-col items-center py-1.5">
                <i data-lucide="calendar" class="w-5 h-5"></i>
                <span class="text-[10px] mt-0.5 font-medium">Сегодня</span>
            </a>
            <button onclick="openMySheet()" class="bottom-nav-btn text-alfa-textGray flex flex-col items-center py-1.5">
                <i data-lucide="table" class="w-5 h-5"></i>
                <span class="text-[10px] mt-0.5 font-medium">Таблица</span>
            </button>
        </div>
    </div>

    <!-- Desktop Quick Actions -->
    <div class="hidden sm:block max-w-3xl mx-auto px-4 sm:px-6 mt-8">
        <div class="grid grid-cols-4 gap-3">
            <a href="/new_call.html" class="glass-card p-4 text-center hover:bg-white/[0.03] transition-colors group">
                <i data-lucide="phone-outgoing" class="w-6 h-6 text-alfa-textGray group-hover:text-alfa-red transition-colors mx-auto mb-2"></i>
                <p class="text-xs font-medium text-alfa-textGray group-hover:text-white transition-colors">Новый звонок</p>
            </a>
            <button onclick="openRepeatCallModal()" class="glass-card p-4 text-center hover:bg-white/[0.03] transition-colors group">
                <i data-lucide="phone-forwarded" class="w-6 h-6 text-alfa-textGray group-hover:text-alfa-red transition-colors mx-auto mb-2"></i>
                <p class="text-xs font-medium text-alfa-textGray group-hover:text-white transition-colors">Повторный звонок</p>
            </button>
            <a href="/today_calls.html" class="glass-card p-4 text-center hover:bg-white/[0.03] transition-colors group">
                <i data-lucide="calendar" class="w-6 h-6 text-alfa-textGray group-hover:text-alfa-red transition-colors mx-auto mb-2"></i>
                <p class="text-xs font-medium text-alfa-textGray group-hover:text-white transition-colors">Звонки сегодня</p>
            </a>
            <button onclick="openMySheet()" class="glass-card p-4 text-center hover:bg-white/[0.03] transition-colors group">
                <i data-lucide="table" class="w-6 h-6 text-alfa-textGray group-hover:text-alfa-red transition-colors mx-auto mb-2"></i>
                <p class="text-xs font-medium text-alfa-textGray group-hover:text-white transition-colors">Моя таблица</p>
            </button>
        </div>
    </div>

    <!-- ==================== CALL REPORT MODAL ==================== -->
    <div id="reportModal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeReportModal()"></div>
        <div class="absolute bottom-0 sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 w-full sm:w-[420px] bg-[#141414] sm:rounded-2xl rounded-t-2xl border-t sm:border border-[#2A2A2A] shadow-2xl" id="reportPanel">
            <div class="p-6">
                <div class="w-12 h-1 bg-white/10 rounded-full mx-auto mb-6 sm:hidden"></div>
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-semibold text-white">Результат звонка</h3>
                    <button onclick="closeReportModal()" class="text-alfa-textGray hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
                </div>
                <div class="mb-5">
                    <p class="text-xs text-alfa-textGray uppercase tracking-wider mb-1">Компания</p>
                    <p class="text-white font-medium text-lg truncate" id="reportCompanyName"></p>
                </div>
                <form id="reportForm" class="space-y-5">
                    <input type="hidden" id="reportInn">
                    <div>
                        <label class="block text-sm font-medium text-alfa-textGray mb-2">Комментарий</label>
                        <textarea id="reportComment" rows="3" required class="w-full bg-[#0B0B0B] border border-[#2A2A2A] rounded-xl p-3 text-white focus:border-alfa-red focus:outline-none placeholder-gray-600" placeholder="О чем договорились?"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-alfa-textGray mb-2">Следующий звонок</label>
                        <input type="text" id="reportDate" placeholder="ДД.ММ.ГГ" required class="w-full bg-[#0B0B0B] border border-[#2A2A2A] rounded-xl p-3 text-white focus:border-alfa-red focus:outline-none placeholder-gray-600 text-center tracking-widest">
                        <div class="flex gap-2 mt-3">
                            <button type="button" onclick="setReportDate(1)" class="px-3 py-1.5 bg-white/5 rounded-lg text-xs text-white hover:bg-white/10">Завтра</button>
                            <button type="button" onclick="setReportDate(2)" class="px-3 py-1.5 bg-white/5 rounded-lg text-xs text-white hover:bg-white/10">Послезавтра</button>
                            <button type="button" onclick="setReportDate(7)" class="px-3 py-1.5 bg-white/5 rounded-lg text-xs text-white hover:bg-white/10">Через неделю</button>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-alfa-red text-white font-semibold py-4 rounded-xl hover:bg-alfa-redHover active:scale-[0.98] transition-all shadow-lg shadow-red-900/20">
                        Сохранить отчет
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- ==================== AI INSIGHT MODAL ==================== -->
    <div id="aiModal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeAiModal()"></div>
        <div class="absolute bottom-0 sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 w-full sm:w-[480px] max-h-[80vh] bg-[#141414] sm:rounded-2xl rounded-t-2xl border-t sm:border border-[#2A2A2A] shadow-2xl overflow-hidden flex flex-col">
            <div class="p-6 pb-0 shrink-0">
                <div class="w-12 h-1 bg-white/10 rounded-full mx-auto mb-6 sm:hidden"></div>
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-5 h-5 text-alfa-red"></i> AI-подсказка
                    </h3>
                    <button onclick="closeAiModal()" class="text-alfa-textGray hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
                </div>
                <p class="text-xs text-alfa-textGray mb-3" id="aiCompanyLabel"></p>
            </div>
            <div class="px-6 pb-6 overflow-y-auto flex-1">
                <div id="aiContent" class="text-sm text-gray-300 leading-relaxed whitespace-pre-wrap"></div>
                <div id="aiLoading" class="text-center py-8">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-alfa-red mx-auto"></div>
                    <p class="text-alfa-textGray text-xs mt-3">Анализирую данные...</p>
                </div>
                <!-- AI Chat -->
                <div id="aiChatSection" class="mt-4 hidden">
                    <div class="border-t border-alfa-border pt-4">
                        <div id="aiChatMessages" class="space-y-3 mb-4 max-h-48 overflow-y-auto"></div>
                        <div class="flex gap-2">
                            <input type="text" id="aiChatInput" placeholder="Задайте вопрос..." class="flex-1 bg-[#0B0B0B] border border-[#2A2A2A] rounded-xl p-3 text-sm text-white focus:border-alfa-red focus:outline-none" onkeydown="if(event.key==='Enter')sendAiChat()">
                            <button onclick="sendAiChat()" class="p-3 bg-alfa-red rounded-xl text-white hover:bg-alfa-redHover transition-colors">
                                <i data-lucide="send" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== REPEAT CALL MODAL ==================== -->
    <div id="repeatModal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeRepeatModal()"></div>
        <div class="absolute bottom-0 sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 w-full sm:w-[420px] bg-[#141414] sm:rounded-2xl rounded-t-2xl border-t sm:border border-[#2A2A2A] shadow-2xl">
            <div class="p-6">
                <div class="w-12 h-1 bg-white/10 rounded-full mx-auto mb-6 sm:hidden"></div>
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-semibold text-white">Повторный звонок</h3>
                    <button onclick="closeRepeatModal()" class="text-alfa-textGray hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
                </div>
                
                <!-- Step 1: INN input -->
                <div id="repeatStep1">
                    <div class="mb-5">
                        <label class="block text-sm font-medium text-alfa-textGray mb-2">ИНН компании</label>
                        <input type="text" id="repeatInn" maxlength="12" placeholder="Введите 10 или 12 цифр" class="w-full bg-[#0B0B0B] border border-[#2A2A2A] rounded-xl p-3 text-white focus:border-alfa-red focus:outline-none tracking-widest text-center text-lg font-mono">
                    </div>
                    <button onclick="searchRepeatCompany()" class="w-full bg-alfa-red text-white font-semibold py-3.5 rounded-xl hover:bg-alfa-redHover transition-colors shadow-lg shadow-red-900/20">Найти компанию</button>
                </div>
                
                <!-- Step 2: Company found + comment -->
                <div id="repeatStep2" class="hidden">
                    <div class="glass-card p-4 mb-5" style="background:#0B0B0B">
                        <p class="text-white font-medium" id="repeatCompanyName"></p>
                        <p class="text-xs text-alfa-textGray mt-1" id="repeatLastComment"></p>
                    </div>
                    <form id="repeatForm" class="space-y-5">
                        <input type="hidden" id="repeatFormInn">
                        <div>
                            <label class="block text-sm font-medium text-alfa-textGray mb-2">Комментарий</label>
                            <textarea id="repeatComment" rows="3" required class="w-full bg-[#0B0B0B] border border-[#2A2A2A] rounded-xl p-3 text-white focus:border-alfa-red focus:outline-none placeholder-gray-600" placeholder="Результат звонка"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-alfa-textGray mb-2">Следующий звонок</label>
                            <input type="text" id="repeatDate" placeholder="ДД.ММ.ГГ" required class="w-full bg-[#0B0B0B] border border-[#2A2A2A] rounded-xl p-3 text-white focus:border-alfa-red focus:outline-none text-center tracking-widest">
                            <div class="flex gap-2 mt-3">
                                <button type="button" onclick="setRepeatDate(1)" class="px-3 py-1.5 bg-white/5 rounded-lg text-xs text-white hover:bg-white/10">Завтра</button>
                                <button type="button" onclick="setRepeatDate(7)" class="px-3 py-1.5 bg-white/5 rounded-lg text-xs text-white hover:bg-white/10">Через неделю</button>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-alfa-red text-white font-semibold py-4 rounded-xl hover:bg-alfa-redHover transition-all shadow-lg shadow-red-900/20">Сохранить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-20 sm:bottom-6 right-6 z-[70] space-y-2"></div>

    <script>
        lucide.createIcons();
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        if (!token) window.location.href = '/';
        
        document.getElementById('userName').textContent = localStorage.getItem('name');
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('ru-RU', options);
        
        if (role === 'admin') {
            document.getElementById('adminLinkContainer').classList.remove('hidden');
            document.getElementById('userRoleLabel').textContent = 'Администратор';
        }

        let allTasks = [];
        let currentAiContext = {};

        // --- Toast ---
        function showToast(msg, type = 'success') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-blue-600' };
            t.className = `toast ${colors[type] || colors.info} text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium max-w-xs`;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        // --- API Helper ---
        async function api(url, opts = {}) {
            const r = await fetch(url, { ...opts, headers: { 'Authorization': `Bearer ${token}`, ...(opts.headers || {}) } });
            if (r.status === 401) { logout(); return null; }
            return r;
        }

        // ==================== TASKS ====================
        async function loadTasks() {
            const container = document.getElementById('tasksContainer');
            const loader = document.getElementById('loading');
            container.classList.add('hidden');
            loader.classList.remove('hidden');
            document.getElementById('emptyState').classList.add('hidden');

            try {
                const r = await api('/tasks');
                if (!r) return;
                allTasks = await r.json();
                renderTasks(allTasks);
            } catch (e) { console.error(e); }
            finally { loader.classList.add('hidden'); }
        }

        function renderTasks(tasks) {
            const container = document.getElementById('tasksContainer');
            const emptyState = document.getElementById('emptyState');
            container.innerHTML = '';
            
            if (!tasks.length) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            emptyState.classList.add('hidden');
            
            tasks.forEach((task, idx) => {
                const statusColor = task.is_overdue ? 'bg-red-500' : 'bg-white';
                const card = document.createElement('div');
                card.className = 'glass-card p-5 task-card relative overflow-hidden fade-in';
                card.style.animationDelay = (idx * 50) + 'ms';
                card.innerHTML = `
                    <div class="absolute left-0 top-0 bottom-0 w-1 ${statusColor}"></div>
                    <div class="pl-3">
                        <div class="flex justify-between items-start mb-3">
                            <div class="min-w-0 flex-1 mr-3">
                                ${task.is_overdue ? '<span class="text-red-500 text-xs font-bold uppercase tracking-wider mb-1 block">Просрочено</span>' : ''}
                                <h3 class="text-lg font-bold text-white leading-tight truncate">${task.company_name}</h3>
                                <p class="text-xs text-alfa-textGray mt-1 font-mono">ИНН ${task.inn}</p>
                            </div>
                            <button onclick="openAiModal('${task.inn}', '${task.company_name.replace(/'/g, "\\'")}')" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-alfa-red hover:bg-alfa-red hover:text-white transition-all shrink-0">
                                <i data-lucide="sparkles" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div class="bg-white/[0.03] p-2.5 rounded-lg">
                                <p class="text-xs text-alfa-textGray mb-0.5">Контакт</p>
                                <p class="text-sm font-medium text-white truncate">${task.contact_name || '---'}</p>
                            </div>
                            <a href="tel:${task.phone}" class="bg-white/[0.03] p-2.5 rounded-lg hover:bg-white/5 transition-colors block">
                                <p class="text-xs text-alfa-textGray mb-0.5">Телефон</p>
                                <div class="flex items-center justify-between">
                                    <p class="text-sm font-medium text-blue-400 truncate">${task.phone || '---'}</p>
                                    <i data-lucide="phone" class="w-3 h-3 text-alfa-textGray shrink-0"></i>
                                </div>
                            </a>
                        </div>
                        ${task.last_comment ? `<div class="mb-4"><p class="text-xs text-alfa-textGray mb-1">Комментарий</p><p class="text-sm text-gray-400 line-clamp-2 leading-relaxed">${task.last_comment.substring(0, 200)}</p></div>` : ''}
                        <div class="flex gap-3">
                            <button onclick="openReportModal('${task.inn}', '${task.company_name.replace(/'/g, "\\'")}')" class="flex-1 bg-white text-black font-semibold py-3 px-4 rounded-xl hover:bg-gray-200 active:scale-[0.98] transition-all flex justify-center items-center gap-2">
                                <i data-lucide="check" class="w-4 h-4"></i> Выполнено
                            </button>
                            <button onclick="skipTask('${task.inn}')" class="px-4 py-3 border border-[#2A2A2A] rounded-xl text-alfa-textGray hover:text-white hover:border-white/20 transition-all" title="Пропустить">
                                <i data-lucide="skip-forward" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function skipTask(inn) {
            allTasks = allTasks.filter(t => t.inn !== inn);
            renderTasks(allTasks);
            showToast('Задача пропущена', 'info');
        }

        // ==================== REPORT MODAL ====================
        function openReportModal(inn, name) {
            document.getElementById('reportInn').value = inn;
            document.getElementById('reportCompanyName').textContent = name;
            document.getElementById('reportComment').value = '';
            document.getElementById('reportDate').value = '';
            document.getElementById('reportModal').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeReportModal() { document.getElementById('reportModal').classList.add('hidden'); }

        function setReportDate(days) {
            const d = new Date(); d.setDate(d.getDate() + days);
            document.getElementById('reportDate').value = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getFullYear()).slice(2)}`;
        }

        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true; btn.innerHTML = '<div class="animate-spin h-5 w-5 border-2 border-white rounded-full border-t-transparent mx-auto"></div>';
            
            try {
                const r = await api('/report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        inn: document.getElementById('reportInn').value,
                        comment: document.getElementById('reportComment').value,
                        next_call_date: document.getElementById('reportDate').value
                    })
                });
                if (r && r.ok) { closeReportModal(); loadTasks(); showToast('Отчет сохранен'); }
                else showToast('Ошибка сохранения', 'error');
            } catch (e) { showToast('Ошибка сети', 'error'); }
            finally { btn.disabled = false; btn.innerHTML = 'Сохранить отчет'; }
        });

        // ==================== AI MODAL ====================
        function openAiModal(inn, companyName) {
            document.getElementById('aiCompanyLabel').textContent = companyName + ' | ИНН ' + inn;
            document.getElementById('aiContent').textContent = '';
            document.getElementById('aiLoading').classList.remove('hidden');
            document.getElementById('aiChatSection').classList.add('hidden');
            document.getElementById('aiChatMessages').innerHTML = '';
            document.getElementById('aiModal').classList.remove('hidden');
            currentAiContext = { inn, company_name: companyName };
            lucide.createIcons();
            fetchAiHint(inn);
        }
        function closeAiModal() { document.getElementById('aiModal').classList.add('hidden'); }

        async function fetchAiHint(inn) {
            try {
                const r = await api(`/ai/hint/${inn}`);
                if (!r) return;
                const data = await r.json();
                document.getElementById('aiLoading').classList.add('hidden');
                document.getElementById('aiContent').textContent = data.insight || 'Нет данных';
                document.getElementById('aiChatSection').classList.remove('hidden');
                lucide.createIcons();
            } catch (e) {
                document.getElementById('aiLoading').classList.add('hidden');
                document.getElementById('aiContent').textContent = 'Ошибка загрузки AI-подсказки';
            }
        }

        async function sendAiChat() {
            const input = document.getElementById('aiChatInput');
            const q = input.value.trim();
            if (!q) return;
            input.value = '';
            
            const msgs = document.getElementById('aiChatMessages');
            msgs.innerHTML += `<div class="bg-white/5 rounded-xl p-3 text-sm text-white">${q}</div>`;
            msgs.innerHTML += `<div id="aiChatLoading" class="text-center py-2"><div class="animate-spin h-5 w-5 border-2 border-alfa-red rounded-full border-t-transparent mx-auto"></div></div>`;
            msgs.scrollTop = msgs.scrollHeight;
            
            try {
                const r = await api('/ai/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: q, ...currentAiContext })
                });
                const data = await r.json();
                const loading = document.getElementById('aiChatLoading');
                if (loading) loading.remove();
                msgs.innerHTML += `<div class="bg-alfa-red/10 border border-alfa-red/20 rounded-xl p-3 text-sm text-gray-300 whitespace-pre-wrap">${data.answer || 'Нет ответа'}</div>`;
                msgs.scrollTop = msgs.scrollHeight;
            } catch (e) {
                const loading = document.getElementById('aiChatLoading');
                if (loading) loading.remove();
                msgs.innerHTML += `<div class="text-red-400 text-xs">Ошибка</div>`;
            }
        }

        // ==================== REPEAT CALL MODAL ====================
        function openRepeatCallModal() {
            document.getElementById('repeatStep1').classList.remove('hidden');
            document.getElementById('repeatStep2').classList.add('hidden');
            document.getElementById('repeatInn').value = '';
            document.getElementById('repeatModal').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeRepeatModal() { document.getElementById('repeatModal').classList.add('hidden'); }

        async function searchRepeatCompany() {
            const inn = document.getElementById('repeatInn').value.trim();
            if (!inn || inn.length < 10) { showToast('Введите корректный ИНН', 'info'); return; }
            
            try {
                const r = await api('/calls/search_for_repeat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ inn })
                });
                const data = await r.json();
                
                document.getElementById('repeatStep1').classList.add('hidden');
                document.getElementById('repeatStep2').classList.remove('hidden');
                document.getElementById('repeatFormInn').value = inn;
                document.getElementById('repeatCompanyName').textContent = data.company_name || 'Компания с ИНН ' + inn;
                
                const comment = data.last_comment || '';
                document.getElementById('repeatLastComment').textContent = comment ? 'Последний: ' + comment.substring(0, 150) : 'Нет предыдущих комментариев';
            } catch (e) { showToast('Ошибка поиска', 'error'); }
        }

        function setRepeatDate(days) {
            const d = new Date(); d.setDate(d.getDate() + days);
            document.getElementById('repeatDate').value = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getFullYear()).slice(2)}`;
        }

        document.getElementById('repeatForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true; btn.textContent = 'Сохранение...';
            
            try {
                const r = await api('/report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        inn: document.getElementById('repeatFormInn').value,
                        comment: document.getElementById('repeatComment').value,
                        next_call_date: document.getElementById('repeatDate').value
                    })
                });
                if (r && r.ok) { closeRepeatModal(); loadTasks(); showToast('Повторный звонок сохранен'); }
                else showToast('Ошибка', 'error');
            } catch (e) { showToast('Ошибка сети', 'error'); }
            finally { btn.disabled = false; btn.textContent = 'Сохранить'; }
        });

        // ==================== MY SHEET ====================
        async function openMySheet() {
            try {
                const r = await api('/sheets/my');
                if (!r) return;
                const data = await r.json();
                window.open(data.url, '_blank');
            } catch (e) { showToast('Не удалось получить ссылку', 'error'); }
        }

        // --- Utils ---
        function logout() { localStorage.clear(); window.location.href = '/'; }

        // --- Init ---
        loadTasks();
    </script>
</body>
</html>
